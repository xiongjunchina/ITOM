# ITOM frontend — Vite build served by nginx, proxies /api/ -> backend:6800.
apiVersion: v1
kind: Service
metadata:
  name: itom-frontend
  namespace: itom
  labels: { app: itom-frontend }
spec:
  selector: { app: itom-frontend }
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: itom-frontend
  namespace: itom
  labels: { app: itom-frontend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: itom-frontend }
  template:
    metadata:
      labels: { app: itom-frontend }
    spec:
      imagePullSecrets:
        - name: harbor-isa
      containers:
        - name: nginx
          image: core.harbor.domain/sn/itom-frontend:87b8f90b
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "10m", memory: "32Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
