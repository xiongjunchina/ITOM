# ITOM frontend — Vite build served by nginx, proxies /api/ -> backend:6800.
apiVersion: v1
kind: Service
metadata:
  name: itom-frontend
  namespace: itom
  labels: { app: itom-frontend }
spec:
  selector: { app: itom-frontend }
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: itom-frontend
  namespace: itom
  labels: { app: itom-frontend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: itom-frontend }
  template:
    metadata:
      labels: { app: itom-frontend }
    spec:
      # Temporary production workaround: the Flannel/CNI path on k8s-01/02 is
      # intermittently unable to resolve/reach the backend Service, which makes
      # nginx return 502. Keep the frontend with backend + DB on healthy k8s-03
      # until the cluster network incident is resolved.
      nodeSelector:
        kubernetes.io/hostname: sn-prod-k8s-03
      imagePullSecrets:
        - name: harbor-isa
      containers:
        - name: nginx
          # k8s-deploy.sh replaces this baseline with the requested immutable tag.
          image: core.harbor.domain/sn/itom-frontend:aily-mcp-public-base-20260730-linux-amd64
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "10m", memory: "32Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
